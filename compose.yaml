name: normacheck

services:
  app:
    image: ${APP_IMAGE:-normacheck:local}
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    cpus: ${APP_CPU_LIMIT:-0.9}
    mem_limit: ${APP_MEMORY_LIMIT:-640m}
    # Total RAM + swap, not an additional 2560 MiB of swap.
    memswap_limit: ${APP_MEMORY_SWAP_LIMIT:-2560m}
    stop_grace_period: 220s
    environment:
      APP_SECRET: ${APP_SECRET:?Set a permanent APP_SECRET of at least 32 characters}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOWED_HOSTS: ${DOMAIN:?Set DOMAIN to the public hostname}
      STORAGE_DIR: /data
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      WORKER_MEMORY_MB: ${WORKER_MEMORY_MB:-768}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      MAX_STORAGE_MB: ${MAX_STORAGE_MB:-2048}
      PROCESSING_TIMEOUT_SECONDS: ${PROCESSING_TIMEOUT_SECONDS:-60}
      UPLOAD_TIMEOUT_SECONDS: ${UPLOAD_TIMEOUT_SECONDS:-120}
      UPLOAD_IDLE_TIMEOUT_SECONDS: ${UPLOAD_IDLE_TIMEOUT_SECONDS:-30}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-12}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-4}
      RATE_LIMIT_MAX_CLIENTS: ${RATE_LIMIT_MAX_CLIENTS:-4096}
      FORWARDED_ALLOW_IPS: ${PROXY_IP:-172.30.76.2}
    volumes:
      - type: bind
        source: ${STORAGE_PATH:?Set STORAGE_PATH to an existing private data directory}
        target: /data
        bind:
          create_host_path: false
      - app_tmp:/tmp/normacheck
    networks:
      backend:
        ipv4_address: ${APP_IP:-172.30.76.3}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health',headers={'Host':os.environ['ALLOWED_HOSTS']}); assert urllib.request.urlopen(r,timeout=3).status==200"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    mem_limit: ${PROXY_MEMORY_LIMIT:-96m}
    memswap_limit: ${PROXY_MEMORY_SWAP_LIMIT:-192m}
    pids_limit: 64
    stop_grace_period: 220s
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN:?Set DOMAIN}}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-22020096}
      PROXY_UPLOAD_TIMEOUT: ${PROXY_UPLOAD_TIMEOUT:-130s}
      PROXY_RESPONSE_TIMEOUT: ${PROXY_RESPONSE_TIMEOUT:-200s}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      backend:
        ipv4_address: ${PROXY_IP:-172.30.76.2}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  backend:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.76.0/29}

volumes:
  app_tmp:
  caddy_data:
  caddy_config:
